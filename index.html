<script>
const TZ='Pacific/Auckland',KEY='lss-jobs-v1';
let D=JSON.parse(localStorage.getItem(KEY)||'null');
if(!D){D={customers:[],jobs:[],parts:LSS_SEED.parts,stock:LSS_SEED.stock,seq:1};save()}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>t?new Date(t).toLocaleString('en-NZ',{timeZone:TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const nzDate=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:TZ});
const dur=(a,b)=>{if(!a||!b)return'—';let m=Math.round((new Date(b)-new Date(a))/60000);return m<0?'?':(m>=60?Math.floor(m/60)+'h ':'')+m%60+'m'};
const mins=(a,b)=>a&&b?Math.max(0,(new Date(b)-new Date(a))/60000):0;
const money=n=>n==null?'—':'$'+Number(n).toFixed(2);
// datetime-local in NZ
function toLocal(t){if(!t)return'';const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(t)).reduce((o,x)=>(o[x.type]=x.value,o),{});return `${p.year}-${p.month}-${p.day}T${p.hour=='24'?'00':p.hour}:${p.minute}`}
function fromLocal(s){if(!s)return null;const guess=new Date(s+'Z');const off=new Date(toLocal(guess)+'Z')-guess;return new Date(guess-off).toISOString()}
const part=pn=>D.parts.find(p=>p.pn==pn);
const cust=i=>D.customers.find(c=>c.id==i)||{name:'(no customer)'};
let view='jobs',arg=null;
function go(v,a){view=v;arg=a;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v.split('-')[0].replace('job','jobs').replace('jobss','jobs')));R[v](a);scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
const R={};
R.jobs=()=>{const f=arg||'open';$('#m').innerHTML=`<button class="b g" id="nj">+ New job</button>
<select id="f"><option value="open">Open jobs</option><option value="all">All jobs</option><option>In progress</option><option>Parts needed</option><option>Completed</option></select>`+
D.jobs.filter(j=>f=='all'||(f=='open'?j.status!='Completed':j.status==f)).sort((a,b)=>b.created.localeCompare(a.created)).map(j=>`<div class="card job" data-id="${j.id}"><div class="row"><b>#${j.no} ${esc(cust(j.cust).name)}</b><span class="tag t-${j.status.split(' ')[0]}">${j.status}</span></div><div>${esc(j.desc)}</div><div class="muted">${esc(j.tech)} · ${fmt(j.created)} · travel ${dur(j.leave,j.arrive)} · on site ${dur(j.arrive,j.finish)}</div></div>`).join('')||'<p class="muted">No jobs.</p>';
$('#f').value=f;$('#f').onchange=e=>go('jobs',e.target.value);$('#nj').onclick=()=>go('jobedit');
document.querySelectorAll('.job').forEach(e=>e.onclick=()=>go('job',e.dataset.id))};
R.jobedit=jid=>{const j=D.jobs.find(x=>x.id==jid)||{tech:'Gary',status:'In progress',from:'van'};
$('#m').innerHTML=`<div class="card"><h3>${jid?'Edit':'New'} job</h3><label>Customer</label><select id="jc"><option value="">— select —</option>${D.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="b s" id="qc">+ New customer</button><br>
<label>Description</label><textarea id="jd">${esc(j.desc)}</textarea><label>Technician</label><input id="jt" list="techs" value="${esc(j.tech)}"><datalist id="techs"><option>Gary<option>Jaco<option>Papinder</datalist>
<label>Status</label><select id="js"><option>In progress</option><option>Parts needed</option><option>Completed</option></select>
<label>Take parts from</label><select id="jf"><option value="van">Van stock</option><option value="shop">Shop stock</option></select>
<button class="b g" id="sv">Save</button><button class="b s" onclick="history.back?go('jobs'):0">Cancel</button></div>`;
$('#jc').value=j.cust||'';$('#js').value=j.status;$('#jf').value=j.from||'van';
$('#qc').onclick=()=>{const n=prompt('Customer name');if(!n)return;const c={id:id(),name:n,phone:prompt('Phone')||'',email:'',address:prompt('Address')||'',notes:''};D.customers.push(c);save();const o=new Option(n,c.id);$('#jc').add(o);$('#jc').value=c.id};
$('#sv').onclick=()=>{let x=D.jobs.find(y=>y.id==jid);if(!x){x={id:id(),no:D.seq++,created:new Date().toISOString(),parts:[]};D.jobs.push(x)}
Object.assign(x,{cust:$('#jc').value,desc:$('#jd').value,tech:$('#jt').value||'Gary',status:$('#js').value,from:$('#jf').value});save();go('job',x.id)}};
R.job=jid=>{const j=D.jobs.find(x=>x.id==jid),c=cust(j.cust);const tot=j.parts.reduce((s,p)=>s+(part(p.pn)?.sell||0)*p.qty,0);
$('#m').innerHTML=`<div class="card"><div class="row"><h3 style="margin:4px 0">Job #${j.no}</h3><span class="tag t-${j.status.split(' ')[0]}">${j.status}</span></div>
<b>${esc(c.name)}</b> <span class="muted">${esc(c.phone||'')} ${esc(c.address||'')}</span><p>${esc(j.desc)}</p><div class="muted">Tech: ${esc(j.tech)} · parts from ${j.from} stock</div>
<button class="b s" id="ed">Edit</button>${['In progress','Parts needed','Completed'].map(s=>`<button class="b s st" data-s="${s}">${s}</button>`).join('')}</div>
<div class="card"><h4 style="margin:4px 0">Time</h4><button class="b o tb" data-k="leave">🚗 Leave for job</button><button class="b tb" data-k="arrive">📍 Arrived on site</button><button class="b g tb" data-k="finish">✅ Finished</button>
<div class="tm"><div><label>Left</label><input type="datetime-local" class="ti" data-k="leave" value="${toLocal(j.leave)}"></div><div><label>Arrived</label><input type="datetime-local" class="ti" data-k="arrive" value="${toLocal(j.arrive)}"></div><div><label>Finished</label><input type="datetime-local" class="ti" data-k="finish" value="${toLocal(j.finish)}"></div></div>
<div id="tsum"><b>Travel:</b> ${dur(j.leave,j.arrive)} · <b>On site:</b> ${dur(j.arrive,j.finish)} · <b>Finished:</b> ${fmt(j.finish)}</div></div>
<div class="card"><h4 style="margin:4px 0">Parts used</h4><table>${j.parts.map((p,i)=>{const q=part(p.pn)||{};return`<tr><td>${p.pn}<br><span class="muted">${esc(q.item)}</span></td><td>×${p.qty}</td><td>${money((q.sell||0)*p.qty)}</td><td><button class="b r rm" data-i="${i}">✕</button></td></tr>`}).join('')}</table>
<div class="muted">Parts total (incl GST): <b>${money(tot)}</b></div>
<input id="ps" placeholder="Search part no., item, brand…"><div id="pr"></div></div>`;
$('#ed').onclick=()=>go('jobedit',jid);
document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{j.status=b.dataset.s;save();go('job',jid)});
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(j[k]&&!confirm('Overwrite existing time?'))return;j[k]=new Date().toISOString();if(k=='finish'&&j.status=='In progress')j.status='Completed';save();go('job',jid)});
document.querySelectorAll('.ti').forEach(i=>i.onchange=()=>{j[i.dataset.k]=fromLocal(i.value);save();go('job',jid)});
document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const p=j.parts.splice(+b.dataset.i,1)[0];const s=D.stock[p.loc][p.pn];if(s)s.qty+=p.qty;save();go('job',jid)});
$('#ps').oninput=e=>{const q=e.target.value.toLowerCase();if(q.length<2){$('#pr').innerHTML='';return}
$('#pr').innerHTML=D.parts.filter(p=>[p.pn,p.item,p.brand,p.cat,p.sup].join(' ').toLowerCase().includes(q)).slice(0,15).map(p=>{const s=D.stock[j.from][p.pn];return`<div class="row card"><div>${p.pn} ${esc(p.item)}<br><span class="muted">${esc(p.brand||'')} · ${j.from}: ${s?s.qty:'n/a'} · ${money(p.sell)}</span></div><button class="b ap" data-pn="${p.pn}">Add</button></div>`}).join('');
document.querySelectorAll('.ap').forEach(b=>b.onclick=()=>{const q=+prompt('Quantity','1');if(!q||q<=0)return;const pn=b.dataset.pn,L=j.from;if(!D.stock[L][pn])D.stock[L][pn]={min:0,qty:0};D.stock[L][pn].qty-=q;j.parts.push({pn,qty:q,loc:L});save();go('job',jid)})}};
R.customers=()=>{$('#m').innerHTML=`<button class="b g" id="nc">+ New customer</button><input id="cs" placeholder="Search customers">`+D.customers.map(c=>`<div class="card cu" data-id="${c.id}" data-t="${esc((c.name+c.phone+c.address).toLowerCase())}"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)} ${esc(c.email)}<br>${esc(c.address)}</div></div>`).join('');
$('#nc').onclick=()=>go('custedit');document.querySelectorAll('.cu').forEach(e=>e.onclick=()=>go('custedit',e.dataset.id));
$('#cs').oninput=e=>document.querySelectorAll('.cu').forEach(c=>c.style.display=c.dataset.t.includes(e.target.value.toLowerCase())?'':'none')};
R.custedit=cid=>{const c=D.customers.find(x=>x.id==cid)||{};const F=['name','phone','email','address','notes'];
$('#m').innerHTML=`<div class="card"><h3>${cid?'Edit':'New'} customer</h3>${F.map(f=>`<label>${f[0].toUpperCase()+f.slice(1)}</label>${f=='notes'?`<textarea id="c_${f}">${esc(c[f])}</textarea>`:`<input id="c_${f}" value="${esc(c[f])}">`}`).join('')}<button class="b g" id="sv">Save</button><button class="b s" id="cn">Cancel</button>
${cid?'<h4>Jobs</h4>'+D.jobs.filter(j=>j.cust==cid).map(j=>`<div class="muted">#${j.no} ${esc(j.desc)} – ${j.status}</div>`).join(''):''}</div>`;
$('#cn').onclick=()=>go('customers');$('#sv').onclick=()=>{if(!$('#c_name').value)return alert('Name required');let x=D.customers.find(y=>y.id==cid);if(!x){x={id:id()};D.customers.push(x)}F.forEach(f=>x[f]=$('#c_'+f).value);save();go('customers')}};
R.stock=()=>{const L=arg||'van',st=D.stock[L];const rows=D.parts.filter(p=>st[p.pn]);const re=rows.filter(p=>st[p.pn].qty<=st[p.pn].min);
$('#m').innerHTML=`<select id="sl"><option value="van">Van stock (Gary)</option><option value="shop">Shop stock (Glenview)</option></select>
<div class="card"><h4 style="margin:4px 0">Reorder list – ${re.length} items</h4><table id="reo">${re.map(p=>`<tr><td>${p.pn}</td><td>${esc(p.item)}</td><td>${st[p.pn].qty}/${st[p.pn].min}</td></tr>`).join('')}</table><button class="b s" id="rcsv">Export reorder CSV</button></div>
<input id="ss" placeholder="Search stock"><div class="card"><table><tr><th>Part</th><th>On hand</th><th>Min</th></tr>${rows.map(p=>`<tr class="sr ${st[p.pn].qty<=st[p.pn].min?'low':''}" data-t="${esc([p.pn,p.item,p.brand,p.cat].join(' ').toLowerCase())}"><td>${p.pn}<br><span class="muted">${esc(p.item)} · ${money(p.sell)}</span></td><td><input type="number" class="sq" data-pn="${p.pn}" data-f="qty" value="${st[p.pn].qty}" style="width:70px"></td><td><input type="number" class="sq" data-pn="${p.pn}" data-f="min" value="${st[p.pn].min}" style="width:60px"></td></tr>`).join('')}</table></div>
<div class="card"><h4>Add new part</h4><input id="np_pn" placeholder="LSS Part No."><input id="np_item" placeholder="Item"><input id="np_brand" placeholder="Brand/Spec"><input id="np_cat" placeholder="Category"><input id="np_sell" type="number" placeholder="Sell incl GST"><input id="np_qty" type="number" placeholder="Qty on hand"><input id="np_min" type="number" placeholder="Min qty"><button class="b g" id="np">Add to ${L}</button></div>`;
$('#sl').value=L;$('#sl').onchange=e=>go('stock',e.target.value);
document.querySelectorAll('.sq').forEach(i=>i.onchange=()=>{st[i.dataset.pn][i.dataset.f]=+i.value||0;save();go('stock',L)});
$('#ss').oninput=e=>document.querySelectorAll('.sr').forEach(r=>r.style.display=r.dataset.t.includes(e.target.value.toLowerCase())?'':'none');
$('#rcsv').onclick=()=>dl(`reorder-${L}.csv`,csv([['Part No','Item','Brand','Supplier Part No','On hand','Min','Cost ex GST'],...re.map(p=>[p.pn,p.item,p.brand,p.sup,st[p.pn].qty,st[p.pn].min,p.cost])]));
$('#np').onclick=()=>{const pn=$('#np_pn').value.trim();if(!pn)return alert('Part no. required');if(!part(pn))D.parts.push({pn,item:$('#np_item').value,brand:$('#np_brand').value,cat:$('#np_cat').value,sell:+$('#np_sell').value||null});st[pn]={qty:+$('#np_qty').value||0,min:+$('#np_min').value||0};save();go('stock',L)}};
R.reports=()=>{const a=arg||{from:nzDate(Date.now()-6*864e5),to:nzDate(Date.now())};const js=D.jobs.filter(j=>{const d=nzDate(j.leave||j.arrive||j.created);return d>=a.from&&d<=a.to});
const by={};js.forEach(j=>{const b=by[j.tech]??={n:0,tr:0,os:0,done:0};b.n++;b.tr+=mins(j.leave,j.arrive);b.os+=mins(j.arrive,j.finish);if(j.status=='Completed')b.done++});const h=m=>Math.floor(m/60)+'h '+Math.round(m%60)+'m';
$('#m').innerHTML=`<div class="card tm"><div><label>From</label><input type="date" id="rf" value="${a.from}"></div><div><label>To</label><input type="date" id="rt" value="${a.to}"></div></div>
<div class="card"><h4 style="margin:4px 0">By technician</h4><table id="rep"><tr><th>Tech</th><th>Jobs</th><th>Done</th><th>Travel</th><th>On site</th></tr>${Object.entries(by).map(([t,b])=>`<tr><td>${esc(t)}</td><td>${b.n}</td><td>${b.done}</td><td>${h(b.tr)}</td><td>${h(b.os)}</td></tr>`).join('')}</table></div>
<div class="card"><h4 style="margin:4px 0">Jobs</h4><table>${js.map(j=>`<tr><td>#${j.no} ${esc(cust(j.cust).name)}<br><span class="muted">${esc(j.tech)} · ${j.status}</span></td><td>🚗 ${dur(j.leave,j.arrive)}<br>📍 ${dur(j.arrive,j.finish)}</td><td>${fmt(j.finish)}</td></tr>`).join('')}</table><button class="b s" id="jcsv">Export jobs CSV</button></div>`;
const upd=()=>go('reports',{from:$('#rf').value,to:$('#rt').value});$('#rf').onchange=upd;$('#rt').onchange=upd;$('#jcsv').onclick=()=>exportJobs(js)};
function exportJobs(js){dl('lss-jobs.csv',csv([['Job','Customer','Phone','Address','Description','Technician','Status','Left (NZ)','Arrived (NZ)','Finished (NZ)','Travel min','On site min','Parts','Parts total incl GST'],...js.map(j=>{const c=cust(j.cust);return[j.no,c.name,c.phone,c.address,j.desc,j.tech,j.status,fmt(j.leave),fmt(j.arrive),fmt(j.finish),Math.round(mins(j.leave,j.arrive)),Math.round(mins(j.arrive,j.finish)),j.parts.map(p=>p.pn+' x'+p.qty).join('; '),j.parts.reduce((s,p)=>s+(part(p.pn)?.sell||0)*p.qty,0).toFixed(2)]})]))}
R.backup=()=>{$('#m').innerHTML=`<div class="card"><h3>Backup</h3><p class="muted">Data is saved on this device only. Export a backup regularly and import it on another phone to move data.</p>
<button class="b" id="ej">Export backup (JSON)</button><button class="b s" id="ec">Export all jobs CSV</button><button class="b s" id="es">Export stock CSV</button><br><br><label>Import backup (replaces data on this device)</label><input type="file" id="ij" accept=".json"><br><button class="b r" id="rs">Reset to seed data</button></div>`;
$('#ej').onclick=()=>dl(`lss-backup-${nzDate(Date.now())}.json`,JSON.stringify(D,null,1),'application/json');$('#ec').onclick=()=>exportJobs(D.jobs);
$('#es').onclick=()=>dl('lss-stock.csv',csv([['Location','Part No','Category','Item','Brand','Supplier Part No','On hand','Min','Reorder','Cost ex GST','Sell incl GST'],...['van','shop'].flatMap(L=>D.parts.filter(p=>D.stock[L][p.pn]).map(p=>{const s=D.stock[L][p.pn];return[L,p.pn,p.cat,p.item,p.brand,p.sup,s.qty,s.min,s.qty<=s.min?'YES':'',p.cost,p.sell]}))]));
$('#ij').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.jobs||!x.stock)throw 0;if(confirm('Replace all data on this device?')){D=x;save();go('jobs')}}catch{alert('Not a valid LSS backup')}};r.readAsText(e.target.files[0])};
$('#rs').onclick=()=>{if(confirm('Delete ALL data on this device and reset?')){localStorage.removeItem(KEY);location.reload()}}};
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function dl(name,text,type='text/csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('en-NZ',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}),1000);
go('jobs');
</script></body></html>
